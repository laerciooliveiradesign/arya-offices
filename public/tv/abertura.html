<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arya Offices</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{ --gold:#E7A930; --gold-soft:#F2C66B; --cream:#F2EBDC; --black:#0E0606; --bordo:#50150F; --ease:cubic-bezier(.22,1,.36,1); }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--black);cursor:none}
  body{font-family:'Jost','Helvetica Neue',system-ui,sans-serif;color:var(--cream);display:grid;place-items:center;position:relative}

  /* Foto da fachada com ken burns em loop (alternate = sem corte) */
  .bg{position:fixed;inset:-4%;z-index:0;
    background:url("../assets/fotos/FachadaAryaEntardecer.jpg") center/cover no-repeat;
    filter:saturate(.9) contrast(1.05);
    animation:ken 34s ease-in-out infinite alternate}
  @keyframes ken{from{transform:scale(1.04)}to{transform:scale(1.13)}}

  /* Overlay escuro (mesmo espírito da hero do site) */
  .veil{position:fixed;inset:0;z-index:1;
    background:
      radial-gradient(46% 55% at 50% 48%, rgba(80,21,15,.42), transparent 66%),
      linear-gradient(180deg, rgba(14,6,6,.66) 0%, rgba(14,6,6,.34) 42%, rgba(14,6,6,.78) 100%),
      radial-gradient(120% 120% at 50% 50%, transparent 52%, rgba(0,0,0,.72))}

  /* Logo centralizado */
  .stage{position:relative;z-index:3;display:grid;place-items:center}
  .glow{position:absolute;width:150%;height:230%;border-radius:50%;
    background:radial-gradient(circle,rgba(231,169,48,.24),rgba(231,169,48,0) 60%);
    filter:blur(8px);animation:glow 5s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.45;transform:scale(.95)}50%{opacity:.95;transform:scale(1.08)}}

  .logo{position:relative;height:clamp(110px,22vh,300px);width:auto;
    filter:drop-shadow(0 10px 46px rgba(0,0,0,.55));
    opacity:0;transform:translateY(14px) scale(.95);
    animation:logoIn 2.4s var(--ease) .3s forwards, float 8s ease-in-out 2.7s infinite}
  @keyframes logoIn{to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.8vh)}}

  .macron{width:clamp(80px,10vw,170px);height:2px;background:var(--gold);
    margin-top:clamp(1.6rem,3.4vh,3rem);opacity:0;transform:scaleX(0);
    animation:draw 1.6s var(--ease) 1.6s forwards}
  @keyframes draw{to{opacity:.9;transform:scaleX(1)}}

  .grain{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.7'/></svg>")}

  @media(prefers-reduced-motion:reduce){
    .bg{animation:none} .logo{animation:none;opacity:1;transform:none}
    .macron{animation:none;opacity:.9;transform:none} .glow{animation:none;opacity:.6}
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="veil"></div>
  <div class="stage">
    <div class="glow"></div>
    <img class="logo" src="../assets/logo-light.svg" alt="Arya Offices" />
    <div class="macron"></div>
  </div>
  <div class="grain"></div>
</body>
</html>
