<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arya Offices</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{ --gold:#E7A930; --gold-soft:#F2C66B; --cream:#F2EBDC; --stone:#C9BFA8;
    --black:#0E0606; --bordo:#50150F; --bordo-deep:#2A0A07; --ease:cubic-bezier(.22,1,.36,1); }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;cursor:none;background:var(--black)}
  body{font-family:'Jost','Helvetica Neue',system-ui,sans-serif;color:var(--cream);display:grid;place-items:center;position:relative}

  /* Fundo simples e escuro: glow bordô no centro + escurecimento. Sem padrão. */
  .bg{position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(52% 58% at 50% 44%, rgba(80,21,15,.55), transparent 68%),
      radial-gradient(120% 120% at 50% 50%, #1B0806 30%, #0E0606 78%);}
  .bg::after{content:"";position:absolute;inset:0;
    background:radial-gradient(120% 120% at 50% 50%, transparent 55%, rgba(0,0,0,.7));
    animation:pulse 9s ease-in-out infinite alternate}
  @keyframes pulse{from{opacity:.6}to{opacity:1}}

  .grain{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:.045;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.7'/></svg>")}

  /* Palco centralizado: logo + macron + frase */
  .stage{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;padding:0 6vw}

  .logo{height:clamp(78px,13vh,190px);width:auto;filter:drop-shadow(0 8px 34px rgba(0,0,0,.5));
    opacity:0;transform:translateY(12px) scale(.96);animation:logoIn 2s var(--ease) .2s forwards}
  @keyframes logoIn{to{opacity:1;transform:none}}

  .macron{width:clamp(64px,7vw,120px);height:2px;background:var(--gold);opacity:0;transform:scaleX(0);
    margin-top:clamp(1.8rem,4vh,3rem);animation:draw 1.4s var(--ease) 1s forwards}
  @keyframes draw{to{opacity:.85;transform:scaleX(1)}}

  /* ciclo de frases */
  .cycler{position:relative;width:100%;
    height:clamp(3.4rem,13vh,10rem);margin-top:clamp(1.6rem,3.5vh,2.8rem);
    display:grid;place-items:center;overflow:hidden}
  .word{position:absolute;white-space:nowrap;
    font-weight:600;line-height:1;color:var(--gold);
    font-size:clamp(2rem,7.5vw,7rem);letter-spacing:.06em;
    opacity:0}
  .word.in{animation:wIn 1s var(--ease) forwards}
  .word.out{animation:wOut .75s var(--ease) forwards}
  @keyframes wIn{
    from{opacity:0;transform:translateY(28px);letter-spacing:.32em}
    to{opacity:1;transform:translateY(0);letter-spacing:.06em}}
  @keyframes wOut{
    from{opacity:1;transform:translateY(0);letter-spacing:.06em}
    to{opacity:0;transform:translateY(-24px);letter-spacing:.2em}}

  @media(prefers-reduced-motion:reduce){
    .bg::after{animation:none}
    .logo,.macron{animation:none;opacity:1;transform:none}
    .word.in{animation:none;opacity:1}
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="stage">
    <img class="logo" src="../assets/logo-light.svg" alt="Arya Offices" />
    <div class="macron"></div>
    <div class="cycler" id="cycler" aria-hidden="true"></div>
  </div>
  <div class="grain"></div>

<script>
  (function(){
    var words=["FLEXIBILIDADE","CONEXÃO","INOVAÇÃO","TECNOLOGIA","CRESCIMENTO"];
    var host=document.getElementById('cycler');
    var reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    var i=0, cur=null;
    function show(){
      var el=document.createElement('span');
      el.className='word in';
      el.textContent=words[i];
      host.appendChild(el);
      var prev=cur; cur=el;
      if(prev){ prev.className='word out'; setTimeout(function(){ if(prev.parentNode) prev.remove(); },800); }
      i=(i+1)%words.length;
    }
    setTimeout(show, 1600);
    setInterval(show, reduce?3400:2800);
  })();
</script>
</body>
</html>
